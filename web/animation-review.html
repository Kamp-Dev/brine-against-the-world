<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brine continuous animation review</title><style>body{background:#143a3f;color:#f5e5bd;font:16px system-ui;margin:20px auto;max-width:900px;padding:12px}canvas{width:100%;background:#e8d6ad;border:3px solid #071f23}button,select,input{font:inherit;padding:10px;margin:5px}input{width:90%}button,select{background:#e8d6ad;color:#17363c}#status{min-height:24px}</style><h1>Brine / Continuous animation</h1><p>Brisk walk → plant feet → raise → fire → lower → walk. Uses the game's character drawing code and weapon assets.</p><canvas id="review" width="900" height="600"></canvas><p id="status"></p><button id="toggle">Pause</button><button id="restart">Restart sequence</button><label>Speed <select id="speed"><option value="1">Normal</option><option value="0.25">Quarter speed</option></select></label><label>Gun <select id="weapon"><option value="scrap">Plugger</option><option value="repeater">Tideline</option><option value="lowtide">Low Tide</option></select></label><label>View <select id="zoom"><option value="1">Game size</option><option value="1.8">Detail</option></select></label><p><input aria-label="Sequence position" id="seek" type="range" min="0" max="6.175" step="0.001" value="0"></p><a style="color:#e8d6ad" href="./">Return to game</a><script>
const canvas=document.querySelector('#review'),ctx=canvas.getContext('2d'),walk=new Image(),fire=new Image(),weaponImages={};let config,settings,ready=false,playing=true,time=0,last=0;const model={state:'travel',age:0,sinceShot:99,settings:{},weapon:'scrap'};
function equipped(){return settings.weapons.find(w=>w.id===model.weapon)}
function gun(p,layer){const w=equipped(),img=weaponImages[w.id];ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);ctx.scale(w.scale*.8,w.scale*.8);ctx.translate(-w.gripX,-w.gripY);
 const region=(x,y,width,height)=>ctx.drawImage(img,x,y,width,height,x,y,width,height);
 if(layer==='grip')region(0,w.splitY,w.splitX,w.height-w.splitY);
 else{region(0,0,w.splitX,w.splitY);region(w.splitX,0,w.width-w.splitX,w.height)}ctx.restore();}


function pose(){const firing=model.state!=='travel',a=firing?config.fire:config.walk;
 let phase=6;if(!firing)phase=(model.age*a.fps)%a.frames;
 else if(model.state==='raise')phase=Math.min(6,model.age/model.settings.raiseDuration*7);
 else if(model.state==='lower')phase=Math.min(6,model.age/model.settings.lowerDuration*7);
 const lowering=model.state==='lower',f=lowering?6-Math.floor(phase):Math.floor(phase),img=firing&&f!==0?fire:walk,b=a.renderBounds||{x:190,y:20,w:413,h:405},k=120/b.h,left=124-b.w*k/2,top=452,p=a.grips[f],next=a.grips[lowering?Math.max(0,f-1):firing?Math.min(6,f+1):(f+1)%a.frames];
 const t=phase-Math.floor(phase),w=equipped(),u=Math.min(1,model.sinceShot/model.settings.recoilDuration);
 const kick=firing?Math.sin(Math.PI*u)*Math.exp(-3*u)*3*w.recoil:0,lean=-kick*.012;
 const hx=left+(p.x-b.x)*k,hy=top+(p.y-b.y)*k,dx=hx-124,dy=hy-572;
 const bearing=0; // Weapon barrel artwork is horizontal; grip-to-muzzle offset is not its angle.
 return{a,img,f,b,k,left,top,lean,grip:{x:124+dx*Math.cos(lean)-dy*Math.sin(lean),y:572+dx*Math.sin(lean)+dy*Math.cos(lean),angle:p.angle+(next.angle-p.angle)*t+bearing+lean-kick*.025,scale:.85}}}
// The weapon follows the displayed hand, with no independent crossfade.
function blendedPose(){return pose()}
function body(p,alpha){const{a,img,f,b,k,left,top}=p;ctx.save();ctx.translate(124,572);ctx.rotate(p.lean||0);ctx.translate(-124,-572);ctx.globalAlpha=alpha;ctx.drawImage(img,(f%a.columns)*a.cellWidth+b.x,Math.floor(f/a.columns)*a.cellHeight+b.y,b.w,b.h,left,top,b.w*k,120);ctx.restore();ctx.globalAlpha=1}

function render(now){let dt=last?(now-last)/1000:0;last=now;if(ready){const travelEnd=config.walk.duration*2,raiseEnd=travelEnd+settings.raiseDuration,fightEnd=raiseEnd+1.8,total=fightEnd+settings.lowerDuration;document.querySelector('#seek').max=total;if(playing)time=(time+Math.min(dt,.1)*Number(document.querySelector('#speed').value))%total;let phase=time;if(phase<travelEnd){model.state='travel';model.age=phase}else if(phase<raiseEnd){model.state='raise';model.age=phase-travelEnd}else if(phase<fightEnd){model.state='fight';model.age=phase-raiseEnd}else{model.state='lower';model.age=phase-fightEnd}model.sinceShot=model.state==='fight'&&model.age>.12?(model.age-.12)%.7:99;const p=pose();ctx.setTransform(2,0,0,2,0,0);ctx.clearRect(0,0,450,300);ctx.fillStyle='#b29b72';ctx.fillRect(0,242,450,2);ctx.save();const zoom=Number(document.querySelector('#zoom').value);ctx.translate(200,242);ctx.scale(zoom,zoom);ctx.translate(-200,-242);ctx.translate(75,-330);gun(p.grip,'grip');body(p,1);gun(p.grip,'barrel');ctx.restore();document.querySelector('#status').textContent=model.state.toUpperCase()+' · frame '+(p.f+1)+' · '+time.toFixed(3)+' s';document.querySelector('#seek').value=time}requestAnimationFrame(render)}
document.querySelector('#toggle').onclick=()=>{playing=!playing;document.querySelector('#toggle').textContent=playing?'Pause':'Play'};document.querySelector('#restart').onclick=()=>{time=0};document.querySelector('#seek').oninput=e=>{time=Number(e.target.value);playing=false;document.querySelector('#toggle').textContent='Play'};document.querySelector('#weapon').onchange=e=>model.weapon=e.target.value;Promise.all([fetch('animation.json?v=shell-flow-1').then(r=>r.json()),fetch('gameplay.json?v=shell-flow-1').then(r=>r.json())]).then(async ([a,s])=>{config=a;settings=s;model.settings=s;walk.src=a.walk.sheet;fire.src=a.fire.sheet;let promises=[walk.decode(),fire.decode()];for(const w of s.weapons){const img=weaponImages[w.id]=new Image();img.src='weapons/'+w.art+'.png';promises.push(img.decode())}await Promise.all(promises);ready=true});requestAnimationFrame(render);
</script>
