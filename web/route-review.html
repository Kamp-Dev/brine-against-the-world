<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Numbered route preview</title><link rel="stylesheet" href="harbor.css?v=illustrated-route-10"><style>body{display:block;padding:24px;color:#f4e7c7;font-family:'Barlow Condensed',sans-serif}main{max-width:720px;margin:auto}#screen{width:min(100%,600px);height:185px;aspect-ratio:auto;margin:24px 0}#masthead{height:auto}button,a{padding:10px;color:#f4e7c7;background:#214b50;border:1px solid #f4e7c7;margin:3px}h1{font-family:Bangers}p{line-height:1.5}</style><main><h1>Numbered route</h1><p>Preview the boss tile and completion states. This page does not change your save.</p><nav><button data-case="approach">Approaching boss</button><button data-case="boss">Boss active</button><button data-case="won">Boss defeated</button><button data-case="next">Next stage</button></nav><div id="screen"><header id="masthead"><canvas id="route-art" width="1984" height="580" aria-label="Approved illustrated route"></canvas><ol id="numbered-route" class="sr-only" aria-label="Stage progression"></ol></header></div><p id="description"></p><a href="./">Return to game</a></main><script src="route-header.js?v=illustrated-route-10"></script><script>const cases={approach:[164,163,'fight','Stage 164: the upcoming boss replaces stage 165’s number.'],boss:[165,164,'fight','Boss stage 165: the skull takes the same salmon CURRENT tile.'],won:[165,165,'reward','Boss defeated: the current boss tile gains its completion check.'],next:[166,165,'travel','Stage 166: the defeated boss remains checked as the route advances.']};function show(key){document.getElementById("numbered-route").dataset.mode=key;const [stage,best,state,label]=cases[key];document.getElementById('numbered-route').innerHTML=BrineRoute.routeMarkup(stage,best,state);document.getElementById('description').textContent=label;}document.querySelector('nav').onclick=e=>{if(e.target.dataset.case)show(e.target.dataset.case)};show('boss');function paint(){const k=document.getElementById('numbered-route').dataset.mode||'boss';const [stage,best,state]=cases[k];BrineRoute.paint(document.getElementById('route-art'),stage,best,state,'Dry Docks');requestAnimationFrame(paint)}paint();</script></html>
