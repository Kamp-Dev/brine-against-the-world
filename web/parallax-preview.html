<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brine · District travel preview</title><style>body{background:#102d30;color:#f4e5bf;font:16px system-ui;margin:24px auto;max-width:720px;padding:0 16px}a{color:#e9b96c}canvas{width:100%;display:block;background:#173b37;border:2px solid #e9b96c}h2{font-size:18px;margin:20px 0 8px}button{padding:12px 20px;background:#e9b96c;color:#173b37;border:0;font:700 16px system-ui;cursor:pointer}p{line-height:1.5}</style><a href="index.html">← Back to Brine</a><h1>Travel through the harbor</h1><p>Distant scenery, nearer structures and the path scroll independently. This preview keeps walking; in the game, scenery stops during combat and while paused.</p><button id="pause">Pause walking</button><span id="status" role="status">Loading scenery…</span><h2>Dry Docks</h2><canvas width="640" height="300" aria-label="Dry Docks moving parallax"></canvas><h2>Drainage Run</h2><canvas width="640" height="300" aria-label="Drainage Run moving parallax"></canvas><h2>Salt Flats</h2><canvas width="640" height="300" aria-label="Salt Flats moving parallax"></canvas><script src="craft-parallax.js?v=1"></script><script>
const load=src=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src;});let moving=true,distance=0,last=0;document.getElementById('pause').onclick=()=>{moving=!moving;document.getElementById('pause').textContent=moving?'Pause walking':'Resume walking';};
Promise.all([Promise.all(['docks','drainage','foundry'].map(n=>load('craft/'+n+'.webp'))),Promise.all(['harbor-quay','harbor-deck'].map(n=>load('scenery/'+n+'.png'))),fetch('parallax.json').then(r=>r.json())]).then(([scenes,originals,config])=>{const original={'harbor-quay':originals[0],'harbor-deck':originals[1]},contexts=[...document.querySelectorAll('canvas')].map(c=>c.getContext('2d'));function frame(now){const dt=last?Math.min(.1,(now-last)/1000):0;last=now;if(moving)distance+=dt*90;for(const [route,c]of contexts.entries()){c.clearRect(0,0,640,300);c.save();c.translate(0,-290);BrineParallax.draw(c,{route,distance},scenes[route],original,config);c.restore();}document.getElementById('status').textContent=' · '+(moving?'Walking':'Paused')+' · '+Math.floor(distance)+' travel units';requestAnimationFrame(frame);}requestAnimationFrame(frame);}).catch(()=>document.getElementById('status').textContent='Could not load scenery. Reload to try again.');
</script></html>
