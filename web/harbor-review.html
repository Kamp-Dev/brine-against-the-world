<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harbor restoration preview</title><style>@font-face{font-family:Bangers;src:url(fonts/Bangers-Regular.ttf)}body{background:#082d35;color:#f7e2b5;font:18px sans-serif;max-width:980px;margin:30px auto;padding:20px}h1,h2,button{font-family:Bangers}h1{font-size:40px}button{background:#bd6245;color:#fff1cf;border:2px solid #efc783;font-size:23px;padding:12px;margin:5px;cursor:pointer}button[aria-pressed=true]{background:#ef9b7e;color:#123d43}.map{border:3px solid #76958a;background:#16434b;margin:20px 0}.map svg{display:block;width:100%}#compare{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}article{background:#173f46;padding:10px;border:1px solid #638782}article svg{width:100%}p{line-height:1.5}@media(max-width:600px){#compare{grid-template-columns:1fr}}</style></head><body><a href="./" style="color:#f1d3a4">Return to game</a><h1>Reclaiming Brine’s harbor</h1><p>This is a visual preview. These controls do not change your game save.</p><nav><button data-level="0">Before restoration</button><button data-level="1">First repairs</button><button data-level="2">Working harbor</button><button data-level="3">Fully restored</button></nav><div class="map" id="map"></div><h2 id="phase"></h2><p id="unlock"></p><div id="compare"></div><h2>In the scrolling harbor</h2><canvas id="world" width="1350" height="840" style="width:100%;border:2px solid #6c9288"></canvas><script src="progression.js"></script><script src="progression-art.js?v=restoration-art-8"></script><script>const phase=['Abandoned foundations','Doors open','Crews at work','Harbor reclaimed'],unlocks=['Defeat Foreman Rusk and earn the workshop permit.','Weapon paths, short expeditions, and form specializations become available as each building opens.','Working equipment marks level two. The workshop adds 5% gun damage, ferry opens chart surveys, and lighthouse adds 5% salvage.','Lit buildings mark level three. Workshop adds 10% gun damage, ferry opens wreck recovery, and lighthouse adds 10% salvage.'];let reviewLevel=0;function show(level){reviewLevel=level;const p=BrineProgression.fresh();p.build=[level,level,level];document.getElementById('map').innerHTML=harborDrawing(p);document.getElementById('phase').textContent=phase[level];document.getElementById('unlock').textContent=unlocks[level];document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.level===level));}document.querySelector('nav').onclick=e=>{if(e.target.dataset.level!==undefined)show(+e.target.dataset.level)};document.getElementById('compare').innerHTML=[0,1,3].map(level=>{const p=BrineProgression.fresh();p.build=[level,level,level];return '<article><h2>'+phase[level]+'</h2>'+harborDrawing(p)+'</article>'}).join('');show(0);</script><script>
const reviewModel={progress:BrineProgression.fresh(),distance:0,route:0,boss:false};const world=document.getElementById('world'),worldContext=world.getContext('2d'),layers=[];Promise.all(['harbor-distance','harbor-quay','harbor-deck'].map(name=>new Promise(resolve=>{const img=new Image();img.onload=()=>{layers.push({name,img});resolve()};img.src='scenery/'+name+'.png'}))).then(()=>{const cfg=[['harbor-distance',66,720,360],['harbor-quay',93,640,248],['harbor-deck',301,700,96]];function frame(t){worldContext.setTransform(3,0,0,3,0,-52*3);worldContext.fillStyle='#e4d4ac';worldContext.fillRect(0,52,450,280);reviewModel.progress.build=[reviewLevel,reviewLevel,reviewLevel];reviewModel.progress.district=[reviewLevel>0,false,false];reviewModel.distance=t*.003;for(const [name,y,w,h] of cfg){worldContext.drawImage(layers.find(l=>l.name===name).img,0,y,w,h);if(name==='harbor-distance')drawHarborGrowth(worldContext,reviewModel)}requestAnimationFrame(frame)}requestAnimationFrame(frame)});
</script></body></html>
